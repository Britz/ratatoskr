site_name: Ratatöskr
site_description: Wikingerzeit-Reenactment · Kleines Museum · Drei Begeisterte
site_url: https://britz.github.io/ratatoskr/
repo_url: https://github.com/britz/ratatoskr
repo_name: britz/ratatoskr
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: de
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Dunkles Design aktivieren
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Helles Design aktivieren
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.png

plugins:
  - search
  - tags
  - obsidian-support
  - glightbox:
      auto_caption: true
      caption_position: bottom

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Start: index.md
  - Über uns: ueber-uns.md
  - Museum: museum.md
  - Kontakt: kontakt.md

exclude_docs: |
  .obsidian/
  .trash/
  templates/
